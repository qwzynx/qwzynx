<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 468" width="500" height="468" role="img" aria-label="Clauto (2026 – Present): A self-hosted layer between me and AI coding CLIs. It estimates each prompt's cost against rolling usage limits, then runs an autopilot over a Kanban board: a branch per card, a test gate, commits as me, and a SQLite journal so interrupted runs resume.">
<title>Clauto (2026 – Present): A self-hosted layer between me and AI coding CLIs. It estimates each prompt's cost against rolling usage limits, then runs an autopilot over a Kanban board: a branch per card, a test gate, commits as me, and a SQLite journal so interrupted runs resume.</title>
<style>
text { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.h { font-family: 'Inter Tight', Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
@keyframes pulse { 50% { opacity: .5; } }
.pulse { animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.float { animation: float 6s ease-in-out infinite; }
@keyframes float-subtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.float-subtle { animation: float-subtle 4s ease-in-out infinite; }
@keyframes glow-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.glow-pulse { animation: glow-pulse 8s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(.8, 0, 1, 1); }
  50% { transform: none; animation-timing-function: cubic-bezier(0, 0, .2, 1); } }
.bounce { animation: bounce 1s infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<defs>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <clipPath id="card"><rect width="500" height="468" rx="18"/></clipPath>
  <clipPath id="phc"><rect x="24" y="24" width="452" height="176" rx="12"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="500" height="468" fill="#0a0a0a"/>
  <rect width="500" height="3" fill="url(#edge)" opacity=".75"/>
</g>
<rect x=".5" y=".5" width="499" height="467" rx="18" fill="none" stroke="#fff" stroke-opacity=".1"/>
<g clip-path="url(#phc)">
  <rect x="24" y="24" width="452" height="176" fill="#0f0f0f"/>
  <rect class="glow-pulse" x="24" y="24" width="452" height="176" fill="url(#ph)" opacity=".3"/>
  <text class="h" x="250.0" y="124.0" font-size="36" font-weight="900" fill="#fff" fill-opacity=".32"
    text-anchor="middle" letter-spacing="-1.5">CLAUTO</text>
</g>
<rect x="24.5" y="24.5" width="451" height="175" rx="12" fill="none" stroke="#fff" stroke-opacity=".1"/>
<text x="24" y="256" font-size="21" font-weight="700" fill="#fff">Clauto</text>
<text x="476" y="253" font-size="10" font-weight="600" fill="#6b7280" text-anchor="end" letter-spacing="1.5">PRIVATE REPO</text>
<text x="24" y="282" font-size="12" font-weight="600" fill="#60a5fa" fill-opacity=".8" letter-spacing=".4">2026 – Present</text>
<text x="24" y="318" font-size="14" fill="#9ca3af">A self-hosted layer between me and AI coding CLIs. It estimates each</text><text x="24" y="340" font-size="14" fill="#9ca3af">prompt's cost against rolling usage limits, then runs an autopilot</text><text x="24" y="362" font-size="14" fill="#9ca3af">over a Kanban board: a branch per card, a test gate, commits as me,</text><text x="24" y="384" font-size="14" fill="#9ca3af">and a SQLite journal so interrupted runs resume.</text>
<rect x="24.0" y="420" width="75.8" height="24" rx="12" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="36.0" y="435.5" font-size="10" font-weight="600" fill="#d1d5db" textLength="51.8" lengthAdjust="spacing">NODE.JS</text><rect x="107.8" y="420" width="98.0" height="24" rx="12" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="119.8" y="435.5" font-size="10" font-weight="600" fill="#d1d5db" textLength="74.0" lengthAdjust="spacing">TYPESCRIPT</text><rect x="213.8" y="420" width="53.6" height="24" rx="12" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="225.8" y="435.5" font-size="10" font-weight="600" fill="#d1d5db" textLength="29.6" lengthAdjust="spacing">HONO</text><rect x="275.4" y="420" width="83.2" height="24" rx="12" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="287.4" y="435.5" font-size="10" font-weight="600" fill="#d1d5db" textLength="59.2" lengthAdjust="spacing">SVELTE 5</text><rect x="366.6" y="420" width="68.4" height="24" rx="12" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="378.6" y="435.5" font-size="10" font-weight="600" fill="#d1d5db" textLength="44.4" lengthAdjust="spacing">SQLITE</text>

</svg>
