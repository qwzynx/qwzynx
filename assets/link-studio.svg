<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Photo &amp; Video">
<title>Photo &amp; Video</title>
<style>
text { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.h { font-family: 'Inter Tight', Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
@keyframes pulse { 50% { opacity: .5; } }
.pulse { animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.float { animation: float 6s ease-in-out infinite; }
@keyframes float-subtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.float-subtle { animation: float-subtle 4s ease-in-out infinite; }
@keyframes glow-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.glow-pulse { animation: glow-pulse 8s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(.8, 0, 1, 1); }
  50% { transform: none; animation-timing-function: cubic-bezier(0, 0, .2, 1); } }
.bounce { animation: bounce 1s infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="4.75" y="2.75" width="210.5" height="36.5" rx="18.25" fill="#0a0a0a" stroke="#fff" stroke-opacity=".15" stroke-width="1.5"/>
<g transform="translate(24 13) scale(.72)" fill="none" stroke="#e5e7eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></g>
<text x="50" y="24.5" font-size="13" font-weight="700" fill="#e5e7eb" textLength="128.4" lengthAdjust="spacing">PHOTO &amp; VIDEO</text>

</svg>
